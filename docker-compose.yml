# Local environment: PostgreSQL, Kafka (KRaft, no ZooKeeper), Kafka UI, Mailpit, the service and the admin UI.
#   docker compose up --build            (settings: .env next to this file, see .env.example)
# Admin UI: http://localhost:3000  API: http://localhost:8080/swagger-ui.html
# Mailpit: http://localhost:8025  Kafka UI: http://localhost:8088
name: notification-service

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: notifications
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.1.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the service (NewTopic beans); auto-creation is disabled.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  notification-service:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/notifications
      DB_USERNAME: notifications
      DB_PASSWORD: notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      MAIL_FROM: ${MAIL_FROM:-no-reply@notifications.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Notifications}
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-local-webhook-secret}
      # Provider per channel; the same variables tell the admin UI what is configured.
      NOTIFICATION_CHANNELS_EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      NOTIFICATION_CHANNELS_SMS_PROVIDER: ${SMS_PROVIDER:-logging}
      NOTIFICATION_CHANNELS_TELEGRAM_PROVIDER: ${TELEGRAM_PROVIDER:-logging}
      NOTIFICATION_CHANNELS_WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-logging}
      NOTIFICATION_CHANNELS_PUSH_PROVIDER: ${PUSH_PROVIDER:-logging}
      NOTIFICATION_CHANNELS_WEBHOOK_PROVIDER: ${WEBHOOK_PROVIDER:-http}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # /dev/tcp is a bash feature; CMD-SHELL would run dash and always fail.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  # Admin UI (react-admin): nginx serves the bundle and proxies /api, /dev, /actuator to the service.
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://notification-service:8080
      APP_TITLE: ${FRONTEND_TITLE:-Notification Service}
      AUTH_MODE: ${FRONTEND_AUTH_MODE:-dev-token}
      DEV_TOKEN_CLIENT_ID: ${FRONTEND_DEV_CLIENT_ID:-admin-ui}
      DEFAULT_LOCALE: ${FRONTEND_LOCALE:-ru}
      POLL_INTERVAL_MS: ${FRONTEND_POLL_INTERVAL_MS:-5000}
      SWAGGER_URL: ${FRONTEND_SWAGGER_URL:-/swagger-ui.html}
      MAILPIT_URL: ${FRONTEND_MAILPIT_URL:-http://localhost:8025}
      KAFKA_UI_URL: ${FRONTEND_KAFKA_UI_URL:-http://localhost:8088}
      EXTRA_CHANNELS: ${FRONTEND_EXTRA_CHANNELS:-}
      CHANNEL_PROVIDERS: EMAIL=${EMAIL_PROVIDER:-smtp},SMS=${SMS_PROVIDER:-logging},TELEGRAM=${TELEGRAM_PROVIDER:-logging},WHATSAPP=${WHATSAPP_PROVIDER:-logging},PUSH=${PUSH_PROVIDER:-logging},WEBHOOK=${WEBHOOK_PROVIDER:-http}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      notification-service:
        condition: service_started

volumes:
  postgres-data:
